services:
  paper:
    image: itzg/minecraft-server:java21
    container_name: virtual-inventories-paper
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "25575:25575"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.8"
      MEMORY: 2G
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "changeme"
      RCON_PORT: 25575
    volumes:
      - ./docker/data:/data
      - ./docker/plugins:/data/plugins
