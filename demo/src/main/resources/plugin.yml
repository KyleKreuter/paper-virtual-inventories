name: virtual-inventories-demo
version: 0.1.0-SNAPSHOT
main: de.kyle.virtualinventories.demo.DemoPlugin
api-version: '1.20'
depend: [packetevents]
commands:
  vmenu:
    description: Opens the packet-based demo menu
    usage: /vmenu
  vpaged:
    description: Opens the paginated packet menu demo
    usage: /vpaged
  vname:
    description: Opens the anvil text-input demo
    usage: /vname
  vreload:
    description: Recompiles menu YAML files and refreshes blobs
    usage: /vreload
  vitem:
    description: Export or hand out named items for ref slots
    usage: /vitem <export|give> <id>
